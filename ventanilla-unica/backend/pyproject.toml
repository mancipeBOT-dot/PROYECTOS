[project]
name = "ventanilla"
version = "0.1.0"
description = "Ventanilla Única Inteligente — Software JRLM. Clasificación y asignación de PQRS."
authors = [{ name = "Jaime Raúl López Mancipe" }]
license = { text = "Propietario. Todos los derechos reservados." }
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.15,<2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "holidays>=0.100",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ventanilla"]

[tool.pytest.ini_options]
testpaths = ["tests"]
